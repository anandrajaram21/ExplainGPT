[project]
name = "ExplainGPT"
version = "0.1.0"
description = "An interactive visualization for seeing how GPT works"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bertviz>=1.4.0",
    "datasets>=3.5.0",
    "jupyterlab>=4.4.0",
    "torch>=2.6.0",
    "transformers>=4.51.0",
    "wandb>=0.19.9",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
exclude = ["**/*"]
